<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주식 매매일지</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Trading Journal</p>
        <h1>주식 매매일지</h1>
      </div>
      <div class="toolbar">
        <label class="file-button">
          CSV 가져오기
          <input id="csvInput" type="file" accept=".csv,text/csv">
        </label>
        <button id="exportBtn" type="button">CSV 내보내기</button>
        <button id="clearBtn" type="button" class="ghost">초기화</button>
      </div>
    </header>

    <main class="layout">
      <section class="summary-grid" aria-label="요약">
        <article>
          <span>보유 종목</span>
          <strong id="holdingCount">0</strong>
        </article>
        <article>
          <span>완료 거래</span>
          <strong id="closedCount">0</strong>
        </article>
        <article>
          <span>평가/실현 순수익</span>
          <strong id="totalNetProfit">0</strong>
        </article>
        <article>
          <span>평균 수익률</span>
          <strong id="averageReturn">0%</strong>
        </article>
      </section>

      <section class="entry-layout">
        <form id="tradeForm" class="panel">
          <div class="panel-head">
            <h2>매매 입력</h2>
            <button id="resetFormBtn" type="button" class="ghost">새 입력</button>
          </div>
          <input id="editIndex" type="hidden">
          <div class="form-grid">
            <label>구매날짜<input name="Buy Date" type="date" required></label>
            <label>종목<input name="Ticker" type="text" placeholder="AAPL, 005930" required></label>
            <label>시장<input name="Market" type="text" placeholder="US, KR"></label>
            <label>구분
              <select name="Side">
                <option>매수</option>
                <option>매도</option>
              </select>
            </label>
            <label>매매단가<input name="Buy Price" type="number" step="0.01" required></label>
            <label>수량<input name="Quantity" type="number" step="1" min="0" required></label>
            <label>수수료<input name="Fee" type="number" step="0.01" min="0" value="0"></label>
            <label>환율<input name="Exchange Rate" type="number" step="0.0001" min="0" value="1"></label>
            <label>현재가<input name="Current Price" type="number" step="0.01" min="0"></label>
            <label>판매날짜<input name="Sell Date" type="date"></label>
            <label>판매가격<input name="Sell Price" type="number" step="0.01" min="0"></label>
          </div>
          <p class="form-note">판매날짜와 판매가격을 입력하면 매매 완료로, 비워두면 보유 중으로 표시됩니다.</p>
          <button type="submit" class="primary">저장</button>
        </form>
      </section>

      <section class="board-grid">
        <section class="panel table-panel">
          <div class="panel-head">
            <h2>현재 보유 중인 주식</h2>
            <input id="holdingSearch" type="search" placeholder="보유 종목 검색">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>구매날짜</th>
                  <th>종목</th>
                  <th>시장</th>
                  <th>구매가</th>
                  <th>현재가</th>
                  <th>수량</th>
                  <th>순수익</th>
                  <th>수익률</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="holdingRows"></tbody>
            </table>
          </div>
        </section>

        <section class="panel table-panel">
          <div class="panel-head">
            <h2>매매 완료한 주식</h2>
            <input id="closedSearch" type="search" placeholder="완료 종목 검색">
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>구매날짜</th>
                  <th>판매날짜</th>
                  <th>종목</th>
                  <th>시장</th>
                  <th>구매가</th>
                  <th>판매가</th>
                  <th>수량</th>
                  <th>순수익</th>
                  <th>수익률</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="closedRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="holdingEmptyTemplate">
      <tr>
        <td colspan="9" class="empty">현재 보유 중인 주식이 없습니다.</td>
      </tr>
    </template>

    <template id="closedEmptyTemplate">
      <tr>
        <td colspan="10" class="empty">매매 완료한 주식이 없습니다.</td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
